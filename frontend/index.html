        <!-- Fonts. Preconnect first so the handshake overlaps with the HTML parse. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
        />

        <!-- Warm the API before any JS parses; the free-tier instance sleeps. -->
        <link rel="preconnect" href="https://project-api-y3d4.onrender.com" crossorigin />

        <!--
            Applies the stored theme before first paint. Without this the page
            renders light and then flips, which is worse than no dark mode.
        -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("sm.theme.v1");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: dark)").matches
                              ? "dark"
                              : "light";
                    document.documentElement.dataset.theme = theme;
                    document.documentElement.style.colorScheme = theme;

                    var design = localStorage.getItem("sm.design.v1");
                    document.documentElement.dataset.design =
                        design === "plain" || design === "editorial" ? design : "plain";
                } catch (error) {
                    /* storage unavailable, the light default is already set */
                }
            })();
        </script>
    </head>
